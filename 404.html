<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0A0A">
<title>404 · Page not found — Abdur Rahman Mallik</title>
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ex:#0A0A0A;--kite:#371E1E;--bark:#33312F;--lc:#726E68;--ash:#B7B4AE;--ease:cubic-bezier(.2,.8,.2,1);--serif:"Instrument Serif",Georgia,serif}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:hidden;max-width:100%;overscroll-behavior-x:none;touch-action:pan-y pinch-zoom;background:var(--ex)}
body{margin:0;min-height:100vh;min-height:100dvh;overflow-x:clip;max-width:100%;touch-action:pan-y pinch-zoom;font:400 17px/1.65 "DM Sans",system-ui,sans-serif;color:var(--ash);display:flex;flex-direction:column;position:relative}
.bg{position:fixed;inset:0;z-index:-2;background:url("/bg.png") center/cover no-repeat}
.tint{position:fixed;inset:0;z-index:-1;background:color-mix(in srgb,var(--ex) 82%,transparent);overflow:hidden}
.tint::after{content:"";position:absolute;inset:-10%;background:radial-gradient(90% 70% at 50% -10%,color-mix(in srgb,var(--ash) 16%,transparent),transparent 65%);animation:mist 20s ease-in-out infinite alternate}
@keyframes mist{from{transform:translate3d(-2%,-1%,0)}to{transform:translate3d(2%,1.5%,0) scale(1.06)}}
header{padding:calc(20px + env(safe-area-inset-top,0px)) clamp(20px,5vw,56px) 20px;display:flex;align-items:center;gap:12px;font-family:var(--serif);font-size:1.45rem}
header a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:12px}
header img{height:34px;width:auto;border-radius:6px}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px clamp(20px,5vw,56px) 40px;max-width:1320px;width:100%;margin:0 auto}
.n{font-family:var(--serif);font-size:clamp(8rem,34vw,26rem);line-height:.78;letter-spacing:-.05em;margin:0;display:flex;overflow:hidden;padding-bottom:.08em}
.n span{display:inline-block;transform:translateY(110%);animation:rise 1.2s var(--ease) forwards;animation-delay:calc(var(--i)*120ms + 150ms)}
@keyframes rise{to{transform:none}}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(2rem,6vw,4.4rem);line-height:1;margin:28px 0 14px;letter-spacing:-.02em;opacity:0;animation:up .9s .7s var(--ease) forwards}
p{margin:0;max-width:32em;color:color-mix(in srgb,var(--ash) 75%,transparent);opacity:0;animation:up .9s .85s var(--ease) forwards}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px;opacity:0;animation:up .9s 1s var(--ease) forwards}
@keyframes up{from{transform:translateY(20px)}to{opacity:1;transform:none}}
.btn{display:inline-flex;align-items:center;min-height:52px;padding:0 28px;border-radius:99px;background:var(--ash);color:var(--ex);text-decoration:none;font-weight:500;border:1px solid var(--ash);transition:transform .3s var(--ease),background-color .3s,color .3s}
.btn.g{background:transparent;color:var(--ash)}
@media (hover:hover){.btn:hover{transform:translateY(-3px)}.btn.g:hover{background:var(--ash);color:var(--ex)}}
footer{padding:20px clamp(20px,5vw,56px) calc(24px + env(safe-area-inset-bottom,0px));font-size:.9rem;color:var(--lc)}
:focus-visible{outline:2px solid currentColor;outline-offset:4px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}.n span,h1,p,.row{opacity:1!important;transform:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div><div class="tint" aria-hidden="true"></div>
<header><a href="/index.html"><img src="/logo.png" alt="" onerror="this.remove()"><span>Abdur Rahman Mallik</span></a></header>
<main>
  <p class="n" style="opacity:1;animation:none;color:var(--ash)" aria-hidden="true"><span style="--i:0">4</span><span style="--i:1">0</span><span style="--i:2">4</span></p>
  <h1>This page doesn’t exist.</h1>
  <p>The link may be broken or the page has moved. Let’s get you back on track.</p>
  <div class="row"><a class="btn" href="/index.html">Go to home</a><a class="btn g" href="/index.html#/websites">See websites</a><a class="btn g" href="/index.html#/contact">Contact me</a></div>
</main>
<footer>© <span id="y">2026</span> Abdur Rahman Mallik</footer>
<script>document.getElementById('y').textContent=new Date().getFullYear()</script>
</body>
</html>
